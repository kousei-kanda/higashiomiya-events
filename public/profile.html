<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>個人ホームページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --color-bg: #f2f2f0;
    --color-surface: #ffffff;
    --color-text: #111111;
    --color-text-dim: #555555;
    --color-green: #1f7a3d;
    --color-green-dark: #175c2d;
    --color-line: #d9d9d6;

    --font-display: "Noto Serif JP", serif;
    --font-body: "Zen Kaku Gothic New", sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    min-height: 100%;
  }

  ::selection {
    background: var(--color-green);
    color: #ffffff;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  a:hover {
    color: var(--color-green);
  }

  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--color-green);
    outline-offset: 2px;
  }

  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 20px;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-line);
  }

  header .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px;
  }

  .site-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: 0.02em;
  }

  nav {
    display: flex;
    gap: 24px;
    font-size: 0.9rem;
  }

  nav a {
    transition: color 0.15s ease;
  }

  .hero {
    padding: 64px 20px 40px;
    text-align: center;
  }

  .hero .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: var(--color-line);
    margin: 0 auto 24px;
  }

  .hero h1 {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 2rem;
    margin: 0 0 12px;
  }

  .hero p {
    color: var(--color-text-dim);
    font-size: 1rem;
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.8;
  }

  section.block {
    padding: 40px 0;
  }

  h2.section-title {
    display: inline-block;
    background: var(--color-green);
    color: #ffffff;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.1rem;
    padding: 10px 20px;
    border-radius: 6px;
    margin: 0 0 24px;
  }

  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: 10px;
    padding: 24px;
  }

  .body-text {
    line-height: 1.9;
    font-size: 0.98rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .item-card {
    background: var(--color-surface);
    border: 1px solid var(--color-line);
    border-radius: 10px;
    padding: 20px;
  }

  .item-card h3 {
    font-family: var(--font-display);
    font-size: 1rem;
    margin: 0 0 8px;
  }

  .item-card p {
    color: var(--color-text-dim);
    font-size: 0.9rem;
    line-height: 1.7;
    margin: 0;
  }

  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .tag {
    background: var(--color-bg);
    border: 1px solid var(--color-line);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.85rem;
    color: var(--color-text-dim);
  }

  .contact-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .contact-list a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
  }

  footer {
    border-top: 1px solid var(--color-line);
    margin-top: 40px;
  }

  footer .wrap {
    padding: 24px 20px;
    font-size: 0.8rem;
    color: var(--color-text-dim);
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <span class="site-name">氏名 / ハンドルネーム</span>
    <nav>
      <a href="#about">About</a>
      <a href="#works">Works</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="avatar"></div>
  <h1>氏名 / ハンドルネーム</h1>
  <p>
    ここに自己紹介の一言を書きます。
  </p>
</section>

<section id="about" class="block">
  <div class="wrap">
    <h2 class="section-title">About</h2>
    <div class="card body-text">
      <p>
        ここに自己紹介の文章を書きます。
      </p>
    </div>
  </div>
</section>

<section id="works" class="block">
  <div class="wrap">
    <h2 class="section-title">Works</h2>
    <div class="grid">
      <div class="item-card">
        <h3>プロジェクト名</h3>
        <p>ここに説明文を書きます。</p>
      </div>
      <div class="item-card">
        <h3>プロジェクト名</h3>
        <p>ここに説明文を書きます。</p>
      </div>
      <div class="item-card">
        <h3>プロジェクト名</h3>
        <p>ここに説明文を書きます。</p>
      </div>
    </div>
  </div>
</section>

<section id="skills" class="block">
  <div class="wrap">
    <h2 class="section-title">Skills</h2>
    <div class="card">
      <div class="tag-list">
        <span class="tag">スキル1</span>
        <span class="tag">スキル2</span>
        <span class="tag">スキル3</span>
        <span class="tag">スキル4</span>
      </div>
    </div>
  </div>
</section>

<section id="contact" class="block">
  <div class="wrap">
    <h2 class="section-title">Contact</h2>
    <div class="card contact-list">
      <a href="mailto:example@example.com">example@example.com</a>
      <a href="https://x.com/example" target="_blank" rel="noopener">X (Twitter)</a>
      <a href="https://github.com/example" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">&copy; 2026 氏名 / ハンドルネーム</div>
</footer>

</body>
</html>
